<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Reservasi</title>
    <link rel="stylesheet" href="../css/outputreservasi.css">
</head>
<body>
    <div class="result-container">
        <h2>Hasil Reservasi</h2>
        <table>
            <tr>
                <th>Nama</th>
                <td id="result-name"></td>
            </tr>
            <tr>
                <th>Email</th>
                <td id="result-email"></td>
            </tr>
            <tr>
                <th>No. HP</th>
                <td id="result-phone"></td>
            </tr>
            <tr>
                <th>Jenis Kelamin</th>
                <td id="result-gender"></td>
            </tr>
            <tr>
                <th>Paket Pilihan</th>
                <td id="result-services"></td>
            </tr>
            <tr>
                <th>Jadwal</th>
                <td id="result-schedule"></td>
            </tr>
            <tr>
                <th>Total</th>
                <td id="result-total"></td>
            </tr>
        </table>
        <button onclick="goBack()">Kembali</button>
    </div>

    <script src="../Js/outputreservasi.js" defer></script>
</body>
</html>
