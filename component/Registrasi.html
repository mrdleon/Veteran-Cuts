<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Email - Pangkas Rambut</title>
    <link rel="stylesheet" href="../css/registrasi.css">
</head>
<body class="mybg">
    <div class="container">
        <h2>Registrasi Email</h2>
        <form action="#" method="post" class="registration-form" onsubmit="registerUser(event)">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" name="full_name" required placeholder="Nama Lengkap Anda">
        
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Email Anda">
        
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" name="password" required placeholder="Kata Sandi Anda">
        
            <label for="confirm-password">Konfirmasi Kata Sandi</label>
            <input type="password" id="confirm-password" name="confirm-password" required placeholder="Konfirmasi Kata Sandi Anda">
        
            <label for="phone">Nomor Telepon</label>
            <input type="text" id="phone" name="phone_number" required placeholder="Nomor Telepon Anda">
        
            <label for="gender">Jenis Kelamin</label>
            <select id="gender" name="gender" required>
                <option value="male">Laki-laki</option>
                <option value="female">Perempuan</option>
                <option value="?">Lainnya</option>
            </select>
        
            <button type="submit">Daftar</button>
            <p class="login-link">Sudah punya akun? 
                <a class="login-link1" href="login.html" onclick="handleLinkClick(event, 'login.html')">Login di sini</a>
            </p>
            <p id="message"></p>
        </form>
    </div>
    <script src="../Js/script.js" defer></script>
</body>
</html>
